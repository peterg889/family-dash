# Runs on every push and pull request: the web app's type check, tests and
# production build, plus a firmware compile and a render of every E-Ink screen
# state (uploaded as an artifact so layout changes can be eyeballed).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Use the example WiFi config (no real credentials in CI)
        run: cp firmware/src/wifi_config.example.h firmware/src/wifi_config.h
      - name: Compile the firmware
        run: pio run -d firmware
      - name: Render every screen state
        run: bash tools/preview/render-all.sh eink-previews
      - uses: actions/upload-artifact@v4
        with:
          name: eink-previews
          path: eink-previews
